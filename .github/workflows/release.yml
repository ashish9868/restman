name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    name: Linux, Windows, and macOS archives
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config dpkg-dev zip nsis osslsigncode

      - name: Use the tag as the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: printf '%s\n' "${GITHUB_REF_NAME#v}" > VERSION

      - name: Build packages
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./scripts/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: restman-packages
          if-no-files-found: error
          path: |
            release/restman_*
            release/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: restman-darwin
          if-no-files-found: error
          path: release/restman_*_darwin_*.tar.gz

  dmg:
    name: macOS disk image
    needs: packages
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: restman-darwin
          path: release

      - name: Build a universal disk image
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          cd release
          archive=$(ls restman_*_darwin_arm64.tar.gz)
          version=${archive#restman_}
          version=${version%_darwin_arm64.tar.gz}
          mkdir -p stage/arm stage/amd
          tar -xzf "restman_${version}_darwin_arm64.tar.gz" -C stage/arm
          tar -xzf "restman_${version}_darwin_amd64.tar.gz" -C stage/amd
          app=stage/universal/Restman.app
          mkdir -p "$app"
          cp -a stage/arm/Restman.app/. "$app/"
          lipo -create \
            stage/amd/Restman.app/Contents/MacOS/restman \
            stage/arm/Restman.app/Contents/MacOS/restman \
            -output "$app/Contents/MacOS/restman"
          chmod 755 "$app/Contents/MacOS/restman"
          cd ..
          ./scripts/make-dmg.sh "release/$app" "release/restman_${version}_darwin_universal.dmg"
          rm -rf release/stage

      - uses: actions/upload-artifact@v4
        with:
          name: restman-dmg
          if-no-files-found: error
          path: release/*.dmg

  publish:
    name: Publish GitHub release
    needs: [packages, dmg]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: restman-packages
          path: release

      - uses: actions/download-artifact@v4
        with:
          name: restman-dmg
          path: release

      - name: Checksums
        run: |
          cd release
          rm -f SHA256SUMS
          sha256sum restman_* > SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
          else
            gh release create "$tag" release/* \
              --title "Restman ${tag}" \
              --generate-notes
          fi
